# Continuous integration for zig_interval.
#
# This file exists because of one specific regression. A change to
# src/interval.zig made the constructor's overflow-ray canonicalisation
# expensive to evaluate at comptime; bench/bench_vec.zig generates its whole
# input table at comptime, so the benchmark stopped compiling on Zig's default
# comptime branch quota. Nothing noticed for a working session, because
# `zig build test` does not build the benchmarks (nothing in build.zig makes
# `test_step`, or the install step, depend on `bench_step`, and the comment
# beside `bench_step` says so) and because nothing ran automatically. The
# `bench` job below is the fix for that regression.
#
# The benchmarks matter more than a step name suggests: build.zig.zon:73-81
# lists the files a published copy of this package carries, and the `bench/`
# directory is not among them. A consumer never compiles a benchmark, so
# nothing downstream of this repository will ever report a benchmark that
# stopped building. It has to be a job.
#
# The rest of this file is the gate that was already true by hand, plus the two
# parts this repository now owns outright: the pinned analyzers (`analyze`) and
# a cross-test that actually RUNS its targets (`cross`) instead of only
# compiling them.
#
# The analyzers and the cross harness are not downloaded here. Both come from
# the distribution in tools/quality/ - pinned upstream revisions, reviewed
# local patches, and a SHA256SUMS covering every file - installed by
# scripts/install-quality-tools.sh into a prefix this workflow names
# explicitly. No job below reads a developer's ~/.local/bin, and no job names
# a moving branch: a tool whose revision is not recorded cannot be a gate,
# because nobody can say afterwards what actually passed.
#
# Every job checks its own tree out. Without that step the workspace is empty
# and `zig build` below has no build.zig to read. The Zig install steps are
# unchanged and still digest-checked exactly as before.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing here writes to the repository, and the default workflow token is
# broader than that needs. Least privilege is one line here and no maintenance
# cost, which is a better trade than the one it replaces.
permissions:
  contents: read

# A group, because `on: push` retriggers this on every push to main and
# nothing deduplicated them: two runs of nine build-and-test jobs on the same
# tree is pure duplicate cost.
#
# QUEUE, DO NOT CANCEL. `cancel-in-progress: true` is the reflexive choice
# and it is wrong here for one specific reason. A cancelled job never reaches
# the post-job step that writes its cache, so every cancelled run throws away
# the caches it just spent ten minutes building - and on a push sequence,
# where each run of this matrix takes long enough that the next push lands
# mid-run, that is most of them. Cancel-in-progress here means the cache is
# cold more often than not, which is the exact failure the per-leg cache keys
# further down exist to fix. Nothing is lost by waiting: no job writes to the
# repository (the token is `contents: read`), none deploys, none publishes,
# and the bench numbers are not gates, so there is no half-finished side
# effect to protect and nothing to keep running.
#
# The queue cannot grow without bound either. GitHub keeps at most one PENDING
# run per group and cancels that one when a newer run arrives, so a burst of
# pushes drains as run-then-latest rather than run-then-every-push-in-between.
#
# `${{ github.workflow }}` because concurrency groups are repository-wide
# rather than workflow-wide, so a bare `${{ github.ref }}` could collide with
# another workflow's group. `${{ github.ref }}` and not `github.head_ref`
# because the group is per-ref: `refs/pull/7/merge` and `refs/pull/8/merge`
# are distinct, so two pull requests never queue behind each other, while
# head_ref would collapse every pull request from one fork into one line.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # The pin. build.zig.zon:28 declares `.minimum_zig_version = "0.16.0"`, and
  # the source is written against 0.16 APIs, so this is a floor and a
  # requirement at once. It is a literal and not `master` or `latest`: a moving
  # toolchain turns this gate red for reasons that have nothing to do with the
  # code, and a red gate nobody trusts is the same as no gate. Stated once,
  # here, and read by the install step and by the cache key below.
  ZIG_VERSION: "0.16.0"
  # sha256 of zig-x86_64-linux-0.16.0.tar.xz, from
  # https://ziglang.org/download/index.json under "0.16.0"."x86_64-linux".
  # Changing ZIG_VERSION without changing this fails the install loudly, which
  # is the correct failure: a toolchain whose digest is unknown is a toolchain
  # nobody pinned.
  ZIG_SHA256: "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00"

jobs:
  # ---------------------------------------------------------------- library --
  # The test step in all four optimise modes, because they are four different
  # compilations and none of them stands in for another. Debug is the mode the
  # checked-build assertions live in; build.zig:156-160 records that ReleaseFast
  # elides the `lo <= hi` assert in `Interval.init` and hands back a NaN
  # interval, which is why the NaN probe pins itself to Debug regardless. A
  # suite that ran Debug only would be testing a build no consumer receives.
  test:
    name: test (${{ matrix.optimize }})
    runs-on: ubuntu-latest
    strategy:
      # One green mode is not evidence about the other three, and a red mode
      # should not hide them behind a cancelled matrix.
      fail-fast: false
      matrix:
        optimize: [Debug, ReleaseSafe, ReleaseFast, ReleaseSmall]
    steps:
      - name: Check out the repository
        # Pinned to a COMMIT, not to the moving `v4` tag, for the same reason
        # the Zig toolchain above is pinned to a digest: a gate that installs
        # whatever a tag points at today cannot say what ran. This is the commit
        # the v4 line pointed at when this line was written (a backport on
        # releases-v4); bumping it is a deliberate edit with a reviewable diff.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Zig ${{ env.ZIG_VERSION }}
        run: |
          set -euo pipefail
          tgz="zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          curl -fsSL --retry 3 --retry-delay 2 -o "/tmp/${tgz}" \
            "https://ziglang.org/download/${ZIG_VERSION}/${tgz}"
          echo "${ZIG_SHA256}  /tmp/${tgz}" | sha256sum --check -
          mkdir -p "/tmp/zig-${ZIG_VERSION}"
          tar -xf "/tmp/${tgz}" --strip-components=1 -C "/tmp/zig-${ZIG_VERSION}"
          # GITHUB_PATH applies to LATER steps, so the version is read through
          # the full path here rather than through the name just added to it.
          test "$(/tmp/zig-${ZIG_VERSION}/zig version)" = "${ZIG_VERSION}"
          echo "/tmp/zig-${ZIG_VERSION}" >> "$GITHUB_PATH"

      - name: Restore the Zig local cache
        uses: actions/cache@v4
        with:
          path: .zig-cache
          # The matrix leg is in the key. GitHub reserves a cache key on the
          # first save and refuses concurrent saves of a key already
          # reserved, so four legs sharing one key means the cache works only
          # when a single leg runs - never on the run that needs it.
          key: zig-${{ env.ZIG_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.optimize }}-${{ hashFiles('build.zig', 'build.zig.zon', 'src/**') }}

      - name: zig build test -Doptimize=${{ matrix.optimize }}
        run: |
          # The NaN-trap probe ABORTS by design: the reproducers test spawns
          # tests/nan_probe.zig as a child process and reads its exit status
          # (build.zig builds `nan_probe` as its own executable and passes its
          # emitted path to that test in `nan_probe_options` as `probe_path`),
          # and a SIGABRT otherwise leaves a core file in the workspace. The
          # limit is `-c`, core-dump size, and it is set in THIS shell because
          # that is where the child inherits it from. It is deliberately not
          # `-v`, and docs/performance-handover.md records why under "What not
          # to do": a `ulimit -v` around `zig build` is wrong, because the
          # compiler inherits it and dies with error:OutOfMemory before a
          # single benchmark row runs.
          ulimit -c 0
          # The nested consumer build is not parameterised by this flag:
          # `run_consumer` in build.zig passes -Doptimize=ReleaseSafe itself
          # and `test_step` depends on that step, so all four modes build the
          # fixture the same way. That is left as it is: the fixture is a real
          # external package under fixture/ and still runs with setCwd on that
          # directory, and what keeps its caches out of the machine-wide global
          # cache is that it gets two cache directories of its own, both
          # ABSOLUTE, named by `consumerCacheRoot`. They are a parent local-cache
          # root with two CHILD names appended - never the parent's own cache or
          # global-cache directory - so flattening them into the parent's would
          # delete the containment those flags exist for. Which root that is
          # comes down to TWO candidates and nothing else: 1, what
          # ZIG_INTERVAL_CONSUMER_CACHE names, if that variable is set to
          # something, and 2, the cache directory this job's own `zig build` was
          # given - --cache-dir, or .zig-cache when no flag is passed. Both are
          # resolved to an absolute path. This job passes no --cache-dir and
          # sets no such variable, so candidate 2 applies: the .zig-cache the
          # restore step above keeps. The only thing this step still writes
          # inside fixture/ is fixture/zig-out, where the child installs - it
          # gets no --prefix - and the recursive `fixture` entry in `.paths`
          # covers that directory as well, which is why `.gitignore` lists it.
          zig build test -Doptimize=${{ matrix.optimize }}

  # ------------------------------------------------------------- benchmarks --
  # The job this whole file was written for. `zig build test` does not build the
  # benchmarks, and the package manifest does not ship them, so a benchmark that
  # stops compiling is invisible everywhere else.
  bench:
    name: bench (compile gate)
    runs-on: ubuntu-latest
    # Generous, because the LP benchmark is the slow one. The bound that
    # matters is a row count, not a wall clock: `row_budget` in
    # bench/bench_lp.zig caps every elimination this file drives at 20,000
    # predicted rows, and `requireRowBudget` is what checks each round against
    # it before the round runs. That is the guard standing between a size
    # mistake and a 329 GB incident.
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Zig ${{ env.ZIG_VERSION }}
        run: |
          set -euo pipefail
          tgz="zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          curl -fsSL --retry 3 --retry-delay 2 -o "/tmp/${tgz}" \
            "https://ziglang.org/download/${ZIG_VERSION}/${tgz}"
          echo "${ZIG_SHA256}  /tmp/${tgz}" | sha256sum --check -
          mkdir -p "/tmp/zig-${ZIG_VERSION}"
          tar -xf "/tmp/${tgz}" --strip-components=1 -C "/tmp/zig-${ZIG_VERSION}"
          test "$(/tmp/zig-${ZIG_VERSION}/zig version)" = "${ZIG_VERSION}"
          echo "/tmp/zig-${ZIG_VERSION}" >> "$GITHUB_PATH"

      - name: Restore the Zig local cache
        uses: actions/cache@v4
        with:
          path: .zig-cache
          # `bench`, as a literal: this job has no matrix, but it is still a
          # distinct writer of .zig-cache - three benchmark roots the `test`
          # job never builds - so it must not contend for a reservation the
          # matrix legs are already writing.
          key: zig-${{ env.ZIG_VERSION }}-${{ runner.os }}-${{ runner.arch }}-bench-${{ hashFiles('build.zig', 'build.zig.zon', 'src/**') }}

      # Three executables, four step names, and naming the three covers the
      # fourth. In build.zig the combined `bench_step` depends on the same
      # three run steps - `run_bench_scalar`, `run_bench_vec` and
      # `run_bench_lp` - and `bench_scalar_step`, `bench_vec_step` and
      # `bench_lp_step`, the three step names below, are pure aliases of those
      # same three, so `bench`
      # is their union and adds no compilation of its own. They are run one at
      # a time rather than through `zig build bench` for two reasons: a failure
      # names the benchmark that produced it, and peak memory is one benchmark
      # instead of three on a shared runner. Compilation is a prerequisite of
      # the run step, so a comptime branch quota blown in bench_vec.zig fails
      # this job and no other - which is the entire point of the file.
      #
      # Nothing here asserts on a number. A benchmark off a contended runner is
      # a measurement, not a gate, and a threshold on one would be flaky and
      # wrong. The step's exit status is the only thing read, and it is a real
      # signal: `requireRowBudget` in bench/bench_lp.zig names the trip
      # through `tripReport` and then leaves through `trap`, so exceeding the
      # budget is a non-zero exit rather than an OOM kill, and the guard
      # survives into CI.
      #
      # `-Doptimize` is not passed and does not need to be. The three benchmark
      # root modules pin ReleaseFast themselves - build.zig gives each of the
      # three `b.createModule` roots `.optimize = .ReleaseFast` - and a
      # compilation takes its mode from its root module, which is the rule
      # build.zig states in the benchmark comment above `bench_scalar`, so
      # the library inside these binaries is ReleaseFast whatever the parent
      # step asks for. Passing it would look like it mattered.
      - name: bench-scalar
        run: zig build bench-scalar
      - name: bench-vec
        run: zig build bench-vec
      - name: bench-lp
        run: zig build bench-lp

  # -------------------------------------------------------------- analyzers --
  # Reproducible enforcement of the four analyzers, from the pinned
  # distribution in tools/quality/, installed into a prefix this job names,
  # and run by the gate that prefix contains.
  #
  # WHY AN INSTALLER AND NOT A BARE `ziglint`. Every analyzer used to be one
  # developer's ~/.local/bin binary, with no recorded revision, no patch set
  # and no checksum, so "the analyzers passed" named a set of binaries nobody
  # else could rebuild or name. tools/quality/manifest.tsv now pins each
  # upstream revision and each reviewed local patch, SHA256SUMS covers every
  # file of the distribution, and the installer refuses to install anything
  # whose hashes or pins do not match. There is no download-at-run-time and no
  # moving branch in this job.
  #
  # HOW THE FOUR ARE BUILT, because one of them is not built like the other
  # three. The installer reads a NAMED recipe from each manifest row and
  # dispatches it from a fixed table -- `default` is the tool's own default
  # step, `cli` is its named install-only step -- and never evaluates that
  # column as a command: an unrecognised name is exit 2 before anything is
  # fetched, never a fallback. ziglint, zlint and zwanzig are `default`, a
  # plain `zig build`. zbc is `cli`.
  #
  # WHY zbc IS DIFFERENT, and what is NOT being done about it. zbc's build.zig
  # leaves upstream's dogfood on the DEFAULT step: `zbc src/` over zbc's own
  # src/, with a CLI that returns 1 on ANY finding. The pinned, patched tree
  # reports 75 findings about itself, so a plain `zig build` in that checkout
  # compiles, links, runs the analyzer over all 153 of its own files, and then
  # exits 1 -- at every severity setting, upstream's own included. That is a
  # property of the reviewed source, not a build failure a job can configure
  # away. `zig build cli` is zbc's own install-only step: it builds and installs
  # the same `zig-out/bin/zbc` and runs none of the self-check. The dogfood is
  # NOT removed, weakened or re-severitised -- `b.default_step.dependOn(
  # &self_check.step)` is upstream's own line and is untouched, and the reviewed
  # patch that names the step changed only how the artifact install is wired,
  # leaving the default step's install dependency exactly as upstream had it --
  # and no rule, severity or finding is suppressed anywhere to make a binary
  # installable.
  #
  # SO WHAT A GREEN INSTALL STEP MEANS, stated before anyone reads it wider: the
  # pinned tree COMPILES, LINKS and INSTALLS. It says nothing about whether zbc
  # finds anything in zbc. What this job asserts about findings is the gate run
  # below, over THIS project's sources. The 75 self-findings are the analyzer's
  # own outstanding work; they are recorded in tools/quality/PROVENANCE.md
  # rather than worked around, and closing them is upstream's next step, not a
  # gate this repository runs. The argv that ran -- step and optimize mode
  # together -- is recorded per install in install-manifest.tsv and asserted in
  # the verification step below.
  #
  # ZIG_GATE_PREFIX IS SET EXPLICITLY, which is the point of naming it: with a
  # prefix named, the installed gate resolves ziglint, zlint, zbc, zwanzig and
  # cross-test to $prefix/bin/<name> and to nothing else - no PATH lookup, no
  # $HOME/.local/bin - and a missing analyzer exits 2 naming the file. So
  # "the tool was not found, carry on" is not a state this job can reach, and a
  # green row means those exact four binaries ran.
  #
  # WHAT THE GATE ASSERTS is unchanged: ziglint, zlint and zwanzig fail on ANY
  # finding, and zbc fails on any finding of severity ERROR. Every finding is
  # printed by rule; no rule is disabled and nothing is excluded.
  #
  # ZBC_STRICT IS UNSET HERE, and that is the whole of the policy: **zbc splits
  # by severity, warnings are advisory, and ZBC_STRICT=1 is the single knob that
  # makes them fail.** There is no whitelist of permitted findings, no
  # per-rule exception list and no file/line carve-out in this file or in the
  # gate, so this job does NOT promise that any fixed set of warnings is
  # tolerated.
  #
  # What is expected on THIS tree: **three reviewed zbc warnings**, the
  # float-to-integer conversions without a clamp, each read and answered with
  # the range proofs at criticalRange in src/interval_ext.zig and expRef in
  # tests/soundness_shared.zig. Those three stay advisory.
  #
  # And to be plain about what this job does NOT promise: **this is not a
  # warning-only run.** An ERROR from ANY zbc rule fails the analyze job, and
  # that now includes the six rules the pinned source carries at upstream
  # severity -- memset_undef_after_len_truncation,
  # f32_narrowing_int_to_float, index_minus_one_without_zero_guard,
  # index_type_narrowing_wraparound, intcast_of_negated_signed and
  # midpoint_addition_overflow -- which were downgraded to warning by an
  # unreviewed capture and have been restored on purpose. A numeric library of
  # this shape can legitimately trip index-type-narrowing-wraparound or
  # intcast-of-negated-signed, and if it does the remedy is a fix in src/,
  # never a severity edit. As an instance of the SHAPE, not a finding here: a
  # ReleaseFast build of the patched analyzer dogfooding itself with `zbc src/`
  # reported index-type-narrowing-wraparound in the analyzer's own
  # src/type_engine/segmented_list.zig -- that path is in the pinned zbc tree,
  # NOT in this repository, which has no src/type_engine/ at all. Whether
  # zig-interval trips any of the six is a separate question this file does not
  # answer. Do not read a green row as "only the three warnings are
  # outstanding"; read the per-rule histograms the gate prints.
  #
  # The other honest limit: with STRICT unset, a FOURTH warning would print and
  # would not fail the job, which is why setting ZBC_STRICT=1 is the right move
  # the moment a new warning appears that nobody has read. Changing interval
  # arithmetic to satisfy a caller-insensitive analysis is not the alternative.
  #
  # The gate's fmt / build / test / ast-check sections run too.
  #
  # --no-cross drops section 9 and nothing else. That section is the `cross`
  # job below: same harness, same five profile targets, same verdicts, with the
  # per-target runtime result asserted rather than summarised. Running it here
  # as well would double the most expensive thing in this file.
  #
  # NO PERFORMANCE THRESHOLD: the gate prints timings, and none of them is a gate.
  analyze:
    name: analyzers (ziglint, zlint, zbc, zwanzig)
    runs-on: ubuntu-latest
    # Generous, because the four analyzers are BUILT from pinned source here,
    # and then the gate builds and runs the suite on top of that. It is a
    # budget, not a target: nothing in this job compares a number to a limit.
    timeout-minutes: 90
    env:
      # Absolute, runner-local, created by this job. Never $HOME, never a
      # default, never NFS: /tmp on this runner is the runner's own local
      # volume, and both the installer and the gate refuse a network
      # filesystem for a cache.
      QUALITY_TOOLS_PREFIX: /tmp/zig-interval-quality/prefix
      QUALITY_TOOLS_WORK_ROOT: /tmp/zig-interval-quality/work
      # The same directory as QUALITY_TOOLS_PREFIX, named a second time because
      # it is a different piece of the harness's interface: it is how the
      # installed gate is told to resolve its tools inside the prefix.
      ZIG_GATE_PREFIX: /tmp/zig-interval-quality/prefix
      GATE_SCRATCH: /tmp/zig-interval-quality/scratch
      GATE_CACHE_DIR: /tmp/zig-interval-quality/zig-cache
      GATE_GLOBAL_CACHE_DIR: /tmp/zig-interval-quality/zig-global-cache
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Zig ${{ env.ZIG_VERSION }}
        run: |
          set -euo pipefail
          tgz="zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          curl -fsSL --retry 3 --retry-delay 2 -o "/tmp/${tgz}" \
            "https://ziglang.org/download/${ZIG_VERSION}/${tgz}"
          echo "${ZIG_SHA256}  /tmp/${tgz}" | sha256sum --check -
          mkdir -p "/tmp/zig-${ZIG_VERSION}"
          tar -xf "/tmp/${tgz}" --strip-components=1 -C "/tmp/zig-${ZIG_VERSION}"
          test "$(/tmp/zig-${ZIG_VERSION}/zig version)" = "${ZIG_VERSION}"
          echo "/tmp/zig-${ZIG_VERSION}" >> "$GITHUB_PATH"
          # ZIG as an ABSOLUTE path rather than a PATH lookup: the installer
          # refuses a compiler it did not test, and the gate runs `zig fmt` and
          # `zig build` through it. A version-selecting shim on PATH would build
          # and lint with something this workflow never pinned.
          echo "ZIG=/tmp/zig-${ZIG_VERSION}/zig" >> "$GITHUB_ENV"

      - name: Restore the pinned quality-tool sources
        uses: actions/cache@v4
        with:
          path: /tmp/zig-interval-quality/work
          # The work root, and only the work root. It holds fetched upstream
          # sources and their build caches, and it is re-used only when four
          # things hold. The first three are BINDINGS: the revision, the ordered
          # patch hashes and the src source digest recorded in the restored
          # stamp must be the ones THIS job's manifest.tsv rows list -- a stamp
          # that only agrees with its own checkout is not evidence of which tree
          # it is about, and an unpatched tool whose pin had since moved would
          # otherwise be reused as though it were the new pin. The fourth is the
          # disk re-derivation, and it is what stops a restored work root from
          # running an edit to a build script that no revision pin covers: the
          # checked-out commit is the bound revision, a freshly computed src
          # digest is the bound digest, and a digest of the BUILD INPUTS
          # (build.zig, build.zig.zon, @embedFile targets, top-level build
          # files) still matches what the stamp recorded for them. Anything
          # short of all four re-fetches, so a restored entry is either the
          # pinned tree or is discarded.
          # The install PREFIX is deliberately NOT cached: those binaries are
          # this job's product, not an input to it.
          key: quality-tools-${{ env.ZIG_VERSION }}-${{ runner.os }}-${{ runner.arch }}-analyzers-${{ hashFiles('tools/quality/manifest.tsv', 'tools/quality/SHA256SUMS', 'tools/quality/harness/**', 'tools/quality/patches/**') }}

      - name: Install the pinned analyzers and the gate
        run: |
          set -euo pipefail
          # analyzers for the four tools, zig-gate for the runner. The installer
          # adds cross-test because the gate's section 9 executes it and prints
          # that it did; this job then runs the gate with --no-cross, so that
          # binary is installed rather than built twice for nothing.
          # No -Doptimize, so every analyzer builds in the installer's default
          # ReleaseFast; which STEP each one is built by is the manifest's
          # recipe column, not this file's, and is checked against the
          # installed manifest below.

          bash scripts/install-quality-tools.sh \
            --prefix "$QUALITY_TOOLS_PREFIX" \
            --work-root "$QUALITY_TOOLS_WORK_ROOT" \
            --zig "$ZIG" \
            --only analyzers,zig-gate

      - name: the installed prefix matches the install manifest, and the tree matches SHA256SUMS
        run: |
          set -euo pipefail
          # TWO DIFFERENT CHECKS, and they are not interchangeable.
          #
          # --verify-only hashes what is CHECKED IN: tools/quality/SHA256SUMS
          # against every file under tools/quality/, and nothing else. It never
          # opens $QUALITY_TOOLS_PREFIX, it creates no prefix and no work root,
          # and a green run says the distribution this job checked out is
          # intact. It is the right check for that and no evidence at all about
          # what landed in the prefix -- which is what the second half below
          # is for. Claiming otherwise here would have made the step assert a
          # guarantee it does not provide.
          bash scripts/install-quality-tools.sh \
            --prefix "$QUALITY_TOOLS_PREFIX" \
            --work-root "$QUALITY_TOOLS_WORK_ROOT" \
            --zig "$ZIG" \
            --verify-only

          # All four analyzers must be present AND executable. Present but not
          # executable is the state a truncated copy or a bad mode leaves, and
          # a bare `test` would say nothing about which file was wrong.
          for tool in ziglint zlint zbc zwanzig; do
            if [ ! -x "$QUALITY_TOOLS_PREFIX/bin/$tool" ]; then
              printf 'analyze: %s/bin/%s is missing or not executable.\n' \
                "$QUALITY_TOOLS_PREFIX" "$tool" >&2
              exit 1
            fi
          done

          # EVERY row of the INSTALLED manifest is re-hashed against the file
          # it names. This reads the manifest the installer actually wrote --
          # it is not re-derived, classified or reconstructed here -- and turns
          # the install_sha256 column from something the installer recorded and
          # nobody read into the check it was written to be. --strict is what
          # makes a MISSING file a failure instead of a skip, so a truncated or
          # deleted binary cannot pass by being absent.
          manifest="$QUALITY_TOOLS_PREFIX/install-manifest.tsv"
          if [ ! -s "$manifest" ]; then
            printf 'analyze: %s is missing or empty; there is nothing to re-hash.\n' \
              "$manifest" >&2
            exit 1
          fi
          rows=$(awk -F'\t' '!/^#/ && NF { n++ } END { print n + 0 }' "$manifest")
          if [ "$rows" -lt 1 ]; then
            printf 'analyze: %s lists no installed files.\n' "$manifest" >&2
            exit 1
          fi
          printf 'analyze: re-hashing %s installed files against %s\n' "$rows" "$manifest"
          (
            cd "$QUALITY_TOOLS_PREFIX"
            awk -F'\t' '!/^#/ && NF { print $8 "  " $7 }' install-manifest.tsv |
              sha256sum --check --strict --quiet -
          )
          printf 'analyze: every installed payload file matches its recorded sha256 (the manifest excludes itself).\n'

          # WHAT ACTUALLY BUILT EACH BINARY is column 10 of the manifest the
          # installer wrote, and it is checked here rather than assumed. This
          # step installs with no -Doptimize, so all four rows must record
          # ReleaseFast, and zbc must be the one recording the `cli` step. A
          # silent revert to a plain `zig build` for zbc would still produce a
          # working binary and pass every hash above -- the dogfood is a
          # property of the analyzer's own checkout and never runs in this job
          # either way -- so the recorded recipe is the only thing that tells
          # the two apart. Four rows is the count too: a manifest missing an
          # analyzer fails here rather than shrinking the gate.
          awk -F'\t' '
            !/^#/ && NF == 12 && $2 == "analyzer" {
              n++
              want = ($1 == "zbc") ? "zig build cli -Doptimize=ReleaseFast" \
                                    : "zig build -Doptimize=ReleaseFast"
              if ($10 != want) {
                printf "analyze: %s records build_recipe [%s], expected [%s]\n", $1, $10, want
                bad = 1
              }
            }
            END {
              if (n != 4) { printf "analyze: %d analyzer rows in the installed manifest, expected 4\n", n; bad = 1 }
              exit bad + 0
            }
          ' "$manifest" || exit 1
          printf 'analyze: every analyzer row records the recipe it was built by.\n'

          # LICENSING, asserted rather than assumed. Every bin/ and
          # lib/cross-test/ file this job installs is first-party and ships
          # under this repository's own MIT, so the notice that covers them must
          # be IN the prefix -- and the re-hash above already proved the file is
          # there and is byte-for-byte what was shipped, because a missing row
          # would fail --strict. Naming it here makes the guarantee legible in
          # the log instead of something a reader has to infer from a directory
          # listing, and keeps the four upstream notices on the same footing.
          notice="$QUALITY_TOOLS_PREFIX/share/zig-interval-quality/licenses"
          for f in harness.LICENSE zbc.LICENSE ziglint.LICENSE zlint.LICENSE zwanzig.LICENSE; do
            if ! [ -r "$notice/$f" ]; then
              printf 'analyze: %s/%s is missing; the prefix carries unlabelled files.\n' \
                "$notice" "$f" >&2
              exit 1
            fi
          done
          printf 'analyze: licences present in the prefix: harness.LICENSE (this repository, MIT) and the four upstream analyser notices.\n'
          printf 'analyze: installed tools, as recorded in install-manifest.tsv:\n'
          cat "$manifest"

      - name: Create the runner-local scratch root
        run: |
          set -euo pipefail
          # GATE_SCRATCH has to EXIST before the gate is started: an explicitly
          # named scratch directory is validated as an existing, writable,
          # non-symlink directory, and the gate stops with exit 2 rather than
          # creating one behind an operator's back. The Zig cache directories
          # do not need this - the gate validates their location and Zig
          # creates them - but their parent has to exist either way, which is
          # what this mkdir gives them.
          # /tmp is accepted here because this runner is not a managed
          # host: the portable rule is a writable local path that is not NFS,
          # and on a managed host the same variable must name a directory
          # under a local volume that host's own policy reserves for this.
          # This job does not decide which mode applies; it names a path the
          # runner owns.
          mkdir -p -- "$GATE_SCRATCH" "$GATE_CACHE_DIR" "$GATE_GLOBAL_CACHE_DIR"
          df -h -- "$GATE_SCRATCH" | tail -1

      - name: zig-gate from the installed prefix
        run: |
          set -euo pipefail
          # The exit status is classified rather than passed on blindly,
          # because the gate's contract is 0 = every section passed, 1 = a
          # section that asserts findings did, 2 = setup or a missing tool. 2
          # is NOT a findings result and must not be read as one.
          gate_exit=0
          "$QUALITY_TOOLS_PREFIX/bin/zig-gate" --no-cross || gate_exit=$?
          case "$gate_exit" in
            0)
              printf 'analyze: every gate section passed, zero findings in ziglint, zlint and zwanzig.\n'
              ;;
            1)
              printf 'analyze: exit 1 - a section that asserts findings did; the per-rule\n' >&2
              printf 'analyze: histograms above name which tool and which rules.\n' >&2
              ;;
            2)
              printf 'analyze: exit 2 - setup failed, or a required tool is missing from %s.\n' \
                "$ZIG_GATE_PREFIX" >&2
              printf 'analyze: this is not a findings result, and nothing was skipped silently.\n' >&2
              ;;
            *)
              printf 'analyze: exit %s is outside the gate contract (0 pass, 1 findings, 2 setup).\n' \
                "$gate_exit" >&2
              ;;
          esac
          exit "$gate_exit"

  # ------------------------------------------------------------------ cross --
  # The project's real cross gate, run for real: cross-test builds AND runs the
  # whole test step for every target in cross-test.profile.sh - x86_64-linux
  # natively, aarch64-linux, riscv64-linux and s390x-linux under qemu_user, and
  # x86_64-windows as compile-only coverage, because this job installs no wine.
  #
  # WHY THE SHAPE CHANGED. This job used to be a four-leg matrix that compiled
  # one target per leg and then explained, at length, why it could not execute
  # them: the harness lived only in one developer's home directory, so there was
  # nothing CI could install and a compile-only row was the only honest claim
  # available. The harness is now a pinned, checksummed distribution in
  # tools/quality/ that scripts/install-quality-tools.sh installs into
  # $QUALITY_TOOLS_PREFIX, so there is something to run, and "compiled" is no
  # longer the strongest thing this job can say. Only the harness subset is
  # installed here: the four analyzers are four source builds and nothing in
  # this job uses them.
  #
  # THE VERDICT IS THE HARNESS'S, NEVER THIS FILE'S. cross-test separates
  # "compiled but this host cannot execute it" from "a test failed" by
  # classifying what it actually ran - the first is runtime_unavailable and
  # becomes build_only, the second is a failure, and a build with no executed
  # checks is never a pass. This job reads that classification out of the
  # summary the harness wrote. There is no exit-status heuristic here, and a
  # missing emulator cannot be mistaken for a green row: the step before the run
  # requires each foreign Linux runner to be installed and executable.
  #
  # WHAT A GREEN ROW MEANS, read from
  # $CROSS_PREFIX/runs/$CROSS_RUN_ID/summary.json - the run-scoped summary; the
  # atomically replaced $CROSS_PREFIX/cross-test-summary.json holds the same
  # document:
  #   x86_64-linux    build pass, run pass, tests > 0
  #   aarch64-linux   build pass, run pass, tests > 0   (qemu_user)
  #   riscv64-linux   build pass, run pass, tests > 0   (qemu_user)
  #   s390x-linux     build pass, run pass, tests > 0   (qemu_user, and
  #                   BIG-ENDIAN: the project's only byte-order coverage, which
  #                   the compile-only matrix never executed either, in a
  #                   repository whose src/rounding.zig steps f64 neighbours by
  #                   u64 bit pattern)
  #   x86_64-windows  compiles, and is NOT counted as a pass. With no wine
  #                   installed that is build_only/runtime_unavailable, which the
  #                   harness reports as compile coverage and never as a runtime
  #                   result. --require-runners is deliberately NOT passed: it
  #                   would turn this project's normal clean result into a
  #                   failure, exactly as the profile says.
  #
  # The NaN probe is not special-cased away. build.zig hands the detected
  # user-mode emulator to the child probe the soundness reproducers spawn, so a
  # probe that could not launch fails instead of passing quietly.
  #
  # THE PROFILE IS THE CONTRACT, so it is READ rather than retyped. The guard
  # step sources ./cross-test.profile.sh - trusted bash, exactly as cross-test
  # does - and requires its TARGETS, its CROSS_TIMEOUT and its concurrency to
  # be the ones written below. A workflow cannot be computed from a file, so a
  # target added to or dropped from the profile turns this job red until the two
  # lists agree on purpose, and the message says which side drifted.
  #
  # No performance threshold here either: the per-target wall clock is printed
  # as information and bounded only by the profile's own budget.
  cross:
    name: cross-test (every profile target, executed)
    runs-on: ubuntu-latest
    # A budget, not a target. Four Linux targets are built and run, three of
    # them under emulation, at the profile's CROSS_TIMEOUT=900 s per target run
    # with two targets in flight and one build job each. 120 minutes leaves room
    # for a cold cache without turning a slow shared runner into a red gate:
    # cross-test's own per-target deadline still reports a timeout as a timeout,
    # which is what the profile's opening section asks a reader to look for
    # first, and it says so in the log rather than in this job's exit status.
    timeout-minutes: 120
    env:
      QUALITY_TOOLS_PREFIX: /tmp/zig-interval-quality/prefix
      QUALITY_TOOLS_WORK_ROOT: /tmp/zig-interval-quality/work
      # cross-test REFUSES to start without TMPDIR and keeps its own state
      # there, so it is named here rather than inherited from the shell: /tmp on
      # this runner is the runner's own local volume, and no network mount is
      # used, because a Zig cache on NFS dies on renameat2.
      TMPDIR: /tmp/zig-interval-quality/tmp
      ZIG_GLOBAL_CACHE_DIR: /tmp/zig-interval-quality/zig-global-cache
      # An absolute output prefix on a local volume. cross-test keeps the
      # per-target logs and both summaries here and rejects an NFS root.
      CROSS_PREFIX: /tmp/zig-interval-quality/cross-out
      # Named, so the verdict is read from THIS run's summary file rather than
      # from whichever file happens to be newest in the tree.
      CROSS_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
      # THE AMBIENT CONCURRENCY IS CLEARED, DELIBERATELY, IN BOTH NAMES
      # cross-test reads. It resolves, in order:
      #     CROSS_JOBS      = $CLI_JOBS       ?: $CROSS_JOBS      ?: $MAX_JOBS ?: 2
      #     CROSS_BUILD_JOBS= $CLI_BUILD_JOBS ?: $CROSS_BUILD_JOBS?: $ZIG_JOBS  ?: 1
      # and cross-test.profile.sh sets neither CROSS_JOBS nor CROSS_BUILD_JOBS.
      # So the guard step's `${CROSS_JOBS:-2}` check used to pass VACUOUSLY --
      # it could not see the value the harness would actually take -- and an
      # inherited MAX_JOBS or ZIG_JOBS silently decided the fan-out. The only
      # symptom appeared two hours later, in the summary's target_jobs field,
      # which is a two-hour failure to learn that an environment variable was
      # set. Empty is not unset to `${var:-}`: it falls through to the built-in
      # default, which is the one this job asserts.
      MAX_JOBS: ""
      ZIG_JOBS: ""
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Zig ${{ env.ZIG_VERSION }}
        run: |
          set -euo pipefail
          tgz="zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          curl -fsSL --retry 3 --retry-delay 2 -o "/tmp/${tgz}" \
            "https://ziglang.org/download/${ZIG_VERSION}/${tgz}"
          echo "${ZIG_SHA256}  /tmp/${tgz}" | sha256sum --check -
          mkdir -p "/tmp/zig-${ZIG_VERSION}"
          tar -xf "/tmp/${tgz}" --strip-components=1 -C "/tmp/zig-${ZIG_VERSION}"
          test "$(/tmp/zig-${ZIG_VERSION}/zig version)" = "${ZIG_VERSION}"
          echo "/tmp/zig-${ZIG_VERSION}" >> "$GITHUB_PATH"
          # Pinned by path, for cross-test: it starts from "${ZIG:-zig}" and
          # probes that executable, so a bare name would take whatever the
          # runner's PATH happened to offer.
          echo "ZIG=/tmp/zig-${ZIG_VERSION}/zig" >> "$GITHUB_ENV"

      - name: Install the QEMU user-mode runtimes
        run: |
          set -euo pipefail
          # The standard Ubuntu package, one package for every foreign Linux
          # triple in the profile. The guard step below then checks each runner
          # by name, so an apt change that renames or drops one of these binaries
          # fails the job HERE instead of quietly demoting a foreign target to
          # build_only - the one failure mode a cross gate cannot have.
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends qemu-user-static

      - name: Restore the pinned harness sources
        uses: actions/cache@v4
        with:
          path: /tmp/zig-interval-quality/work
          # Same work root and same pin hash as the analyze job, with its own
          # key dimension for the reason the .zig-cache keys below carry one:
          # GitHub reserves a key on the first save and refuses a second save
          # for it, so two jobs sharing one key would make it warm only when one
          # of them runs.
          key: quality-tools-${{ env.ZIG_VERSION }}-${{ runner.os }}-${{ runner.arch }}-harness-${{ hashFiles('tools/quality/manifest.tsv', 'tools/quality/SHA256SUMS', 'tools/quality/harness/**', 'tools/quality/patches/**') }}

      - name: Install the pinned cross-test harness
        run: |
          set -euo pipefail
          # --only cross-test, not --only all: this job runs no analyzer, and
          # installing one here would cost four source builds for nothing.
          bash scripts/install-quality-tools.sh \
            --prefix "$QUALITY_TOOLS_PREFIX" \
            --work-root "$QUALITY_TOOLS_WORK_ROOT" \
            --zig "$ZIG" \
            --only cross-test
          # The helper is not optional decoration: cross-test's scratch policy
          # lives in it, and a cross-test without it is not the harness this job
          # claims to run. Both checks say what is missing rather than exiting
          # silently on a bare `test`.
          if [ ! -x "$QUALITY_TOOLS_PREFIX/bin/cross-test" ]; then
            printf 'cross: %s/bin/cross-test is missing or not executable after the install.\n' \
              "$QUALITY_TOOLS_PREFIX" >&2
            exit 1
          fi
          if [ ! -r "$QUALITY_TOOLS_PREFIX/lib/cross-test/scratch-contract.sh" ]; then
            printf 'cross: %s/lib/cross-test/scratch-contract.sh is missing after the install.\n' \
              "$QUALITY_TOOLS_PREFIX" >&2
            exit 1
          fi

      - name: the profile is the target contract, and every runner is installed
        env:
          # The profile's TARGETS, restated so the two can be compared. Update
          # this on purpose when the profile changes; the harness, not this job,
          # decides what actually runs.
          EXPECTED_TARGETS: x86_64-linux aarch64-linux riscv64-linux s390x-linux x86_64-windows
        run: |
          set -euo pipefail
          # Sourced AFTER the shell options are set and as trusted bash, which is
          # how cross-test itself reads it. The profile may not change shell
          # options, traps or the working directory, so nothing in that file can
          # quietly disarm this step.
          source ./cross-test.profile.sh
          if ! declare -p TARGETS >/dev/null 2>&1; then
            printf 'cross: ./cross-test.profile.sh no longer defines TARGETS as a bash array.\n' >&2
            printf 'cross: this job is built on that file, so it cannot pick a target set on its own.\n' >&2
            exit 1
          fi
          read -ra expected <<<"$EXPECTED_TARGETS"
          if [[ " ${TARGETS[*]} " != " ${expected[*]} " ]]; then
            printf 'cross: this job and cross-test.profile.sh disagree about the target set.\n' >&2
            printf 'cross:   in the profile: %s\n' "${TARGETS[*]}" >&2
            printf 'cross:   expected here: %s\n' "${expected[*]}" >&2
            printf 'cross: The profile is the contract; update EXPECTED_TARGETS on purpose.\n' >&2
            exit 1
          fi
          if [[ ${CROSS_TIMEOUT:-} != 900 ]]; then
            printf 'cross: profile CROSS_TIMEOUT is %s, not the 900 this job asserts.\n' \
              "${CROSS_TIMEOUT:-unset}" >&2
            exit 1
          fi
          if [[ ${CROSS_JOBS:-2} != 2 || ${CROSS_BUILD_JOBS:-1} != 1 ]]; then
            printf 'cross: profile concurrency is targets=%s builds=%s, not 2 targets / 1 build job.\n' \
              "${CROSS_JOBS:-unset}" "${CROSS_BUILD_JOBS:-unset}" >&2
            exit 1
          fi
          # ... AND the value the harness will actually resolve to. The check
          # above reads the profile's own declaration; this one reproduces the
          # harness's resolution order exactly -- CLI flags first, and this job
          # passes none, then the profile variable, then the ambient one the
          # job env empties, then the built-in default. Asserting only the
          # declaration is how an inherited MAX_JOBS used to survive this guard
          # and surface as a red job two hours into the emulated runs.
          resolved_target_jobs=${CROSS_JOBS:-${MAX_JOBS:-2}}
          resolved_build_jobs=${CROSS_BUILD_JOBS:-${ZIG_JOBS:-1}}
          if [[ $resolved_target_jobs != 2 || $resolved_build_jobs != 1 ]]; then
            printf 'cross: cross-test will resolve targets=%s builds=%s, not 2 targets / 1 build job.\n' \
              "$resolved_target_jobs" "$resolved_build_jobs" >&2
            printf 'cross: the job environment carries MAX_JOBS=%s ZIG_JOBS=%s.\n' \
              "${MAX_JOBS:-unset}" "${ZIG_JOBS:-unset}" >&2
            exit 1
          fi
          # A PREREQUISITE check, not a verdict: every foreign Linux row must
          # have its user-mode emulator present before the run, so a missing
          # package is a red job instead of a build_only row that reads like
          # coverage. The harness's own detection still decides what runs; this
          # only refuses to start without the emulator.
          host_arch=$(uname -m)
          for t in "${TARGETS[@]}"; do
            [[ "$t" == "${host_arch}-linux" ]] && continue
            case "$t" in
              *-linux) ;;
              *) continue ;;
            esac
            arch=${t%%-*}
            if command -v -- "qemu-$arch" >/dev/null 2>&1; then
              runner=$(command -v -- "qemu-$arch")
            elif command -v -- "qemu-$arch-static" >/dev/null 2>&1; then
              runner=$(command -v -- "qemu-$arch-static")
            else
              runner=
            fi
            if [ -z "$runner" ]; then
              printf 'cross: no qemu user-mode runner for %s (looked for qemu-%s and qemu-%s-static).\n' \
                "$t" "$arch" "$arch" >&2
              printf 'cross: a missing emulator must not be reported as compile coverage.\n' >&2
              exit 1
            fi
            printf 'cross: %s will run under %s\n' "$t" "$runner"
          done
          printf 'cross: %d profile targets, CROSS_TIMEOUT=%ss, %s target jobs x %s build job; host arch %s.\n' \
            "${#TARGETS[@]}" "${CROSS_TIMEOUT}" "$resolved_target_jobs" "$resolved_build_jobs" "$host_arch"

      - name: cross-test, then the per-target verdict from its own summary
        run: |
          set -euo pipefail
          # No --timeout and no --targets: the profile owns both. --output is
          # named here rather than left to the default, because the default is
          # zig-out/cross-test inside this checkout and the run's evidence
          # belongs on the runner's own local volume, named by CROSS_PREFIX.
          ct_exit=0
          "$QUALITY_TOOLS_PREFIX/bin/cross-test" --output "$CROSS_PREFIX" || ct_exit=$?
          summary="$CROSS_PREFIX/runs/$CROSS_RUN_ID/summary.json"
          if [ ! -r "$summary" ]; then
            printf 'cross: cross-test exited %s and wrote no summary at %s.\n' "$ct_exit" "$summary" >&2
            printf 'cross: run directories under %s/runs: %s\n' \
              "$CROSS_PREFIX" "$(ls -1 "$CROSS_PREFIX/runs" 2>&1)" >&2
            exit 1
          fi
          python3 - "$summary" "$ct_exit" <<'PY'
          import json
          import sys

          # The four Linux rows must each show a build that passed, a run that
          # passed, and a positive executed-test count. A build_only or
          # no_test_results row is compile coverage, not a pass, and that
          # distinction is the whole reason this step exists.
          # The same five names as the guard step's EXPECTED_TARGETS, restated
          # because this step asserts per-target verdicts and a set comparison
          # needs a set of its own. Moving a target in the profile means moving
          # it in BOTH places on purpose: half of the change fails loudly here
          # rather than quietly dropping a row from the verdict.
          LINUX = ("x86_64-linux", "aarch64-linux", "riscv64-linux", "s390x-linux")
          WINDOWS = "x86_64-windows"

          path = sys.argv[1]
          ct_exit = int(sys.argv[2])
          with open(path, encoding="utf-8") as handle:
              doc = json.load(handle)

          rows = {row["target"]: row for row in doc["targets"]}
          problems = []
          if len(rows) != len(doc["targets"]):
              problems.append("summary contains duplicate target rows")

          for row in doc["targets"]:
              print("cross: %-14s build=%-6s run=%-12s tests=%-5s reason=%-22s status=%s" % (
                  row["target"], row["build"]["status"], row["run"]["status"],
                  row["run"]["tests"], row["reason"], row["status"]))

          if doc["schema"] != 2:
              problems.append("summary schema is %r, not 2" % (doc["schema"],))
          if doc["zig_version"] != "0.16.0":
              problems.append("cross-test used Zig %r, not the pinned 0.16.0" % (doc["zig_version"],))
          if doc["run_timeout_seconds"] != 900:
              problems.append("run_timeout_seconds=%r, not the profile's CROSS_TIMEOUT=900"
                              % (doc["run_timeout_seconds"],))
          if doc["target_jobs"] != 2 or doc["jobs_per_build"] != 1:
              problems.append("concurrency was targets=%r builds=%r, not 2 targets / 1 build job"
                              % (doc["target_jobs"], doc["jobs_per_build"]))
          if doc["target_count"] != len(doc["targets"]):
              problems.append("target_count=%d but %d target rows"
                              % (doc["target_count"], len(doc["targets"])))
          if sorted(rows) != sorted(LINUX + (WINDOWS,)):
              problems.append("summary rows %s, expected %s"
                              % (sorted(rows), sorted(LINUX + (WINDOWS,))))
          if doc["bookkeeping_failure"]:
              problems.append("cross-test reported bookkeeping_failure")
          if doc["exit_code"] != ct_exit:
              problems.append("summary exit_code=%r but the process exited %d"
                              % (doc["exit_code"], ct_exit))

          for target in LINUX:
              row = rows.get(target)
              if row is None:
                  continue
              tests = row["run"]["tests"]
              if row["build"]["status"] != "pass":
                  problems.append("%s did not build: build=%s" % (target, row["build"]["status"]))
              if (row["status"] != "pass" or row["run"]["status"] != "pass"
                      or type(tests) is not int or tests <= 0):
                  problems.append(
                      "%s has no runtime pass: status=%s run=%s reason=%s tests=%s"
                      % (target, row["status"], row["run"]["status"], row["reason"],
                         row["run"]["tests"]))

          # The Windows row, judged on what it actually says. The claim printed
          # at the end of this step used to be a constant -- "is compile-only
          # coverage" -- regardless of the row, so a run that found a wine
          # runner and executed the suite would still have been announced as
          # untested coverage. The verdict is the harness's; the sentence is
          # this step's, so the sentence follows the row.
          windows_claim = "%s has no row in the summary" % WINDOWS
          row = rows.get(WINDOWS)
          if row is not None:
              if row["build"]["status"] != "pass":
                  problems.append("%s did not compile: build=%s" % (WINDOWS, row["build"]["status"]))
              if row["status"] == "build_only":
                  # Compile coverage with no runtime. Reported as exactly that,
                  # and the counts check below proves it was not counted as a
                  # pass. A row that claims compile-only while reporting an
                  # executed run is internally inconsistent, and believing the
                  # claim would understate the coverage rather than overstate
                  # it -- which is why it is still a failure and not a note.
                  if row["run"]["status"] == "pass" or (row["run"]["tests"] or 0) > 0:
                      problems.append(
                          "%s claims compile-only coverage but reports run=%s tests=%s"
                          % (WINDOWS, row["run"]["status"], row["run"]["tests"]))
                  windows_claim = (
                      "%s is compile-only coverage: build=%s run=%s tests=%s reason=%s"
                      % (WINDOWS, row["build"]["status"], row["run"]["status"],
                         row["run"]["tests"], row["reason"]))
              elif row["status"] == "pass":
                  if (row["run"]["status"] != "pass"
                          or type(row["run"]["tests"]) is not int or row["run"]["tests"] <= 0):
                      problems.append("%s claims pass without an executed run" % WINDOWS)
                  windows_claim = (
                      "%s built AND ran: run=%s tests=%s"
                      % (WINDOWS, row["run"]["status"], row["run"]["tests"]))
              else:
                  problems.append("%s is neither a runtime pass nor compile-only coverage: %s"
                                  % (WINDOWS, row["status"]))
                  windows_claim = "%s is status=%s, which is neither" % (WINDOWS, row["status"])

          counts = doc["counts"]
          passed_rows = sum(1 for row in doc["targets"] if row["status"] == "pass")
          if counts["fail"] != 0:
              problems.append("counts.fail=%d" % counts["fail"])
          if counts["pass"] != passed_rows:
              problems.append("counts.pass=%d but %d target rows say pass"
                              % (counts["pass"], passed_rows))
          if doc["status"] not in ("pass", "partial"):
              problems.append("overall status is %r, not pass or partial" % (doc["status"],))
          if ct_exit != 0:
              problems.append("cross-test exited %d" % ct_exit)

          print("cross: status=%s pass=%d fail=%d build_only=%d partial=%d exit=%d summary=%s"
                % (doc["status"], counts["pass"], counts["fail"], counts["build_only"],
                   counts["partial"], ct_exit, path))
          if problems:
              for problem in problems:
                  print("cross: FAIL %s" % problem, file=sys.stderr)
              sys.exit(1)
          print("cross: every Linux target in the profile built AND ran; %s." % windows_claim)
          PY


  # ------------------------------------------------------------------- fmt --
  # The argument list is exactly the tracked Zig source roots, taken from
  # `git ls-files '*.zig'`: build.zig at the root, then bench/, fixture/,
  # probe/, src/ and tests/. They are named one by one rather than
  # `zig fmt --check .` so that a build directory which happens to hold a .zig
  # file cannot turn the gate red for a file nobody committed.
  #
  # build.zig.zon is not in the list because `zig fmt` does not treat ZON as
  # input unless --zon is passed, and --zon applies to every argument, so a ZON
  # file and a Zig file cannot be checked in one invocation. Checking it means
  # a second command, and it is not worth a second command.
  #
  # No cache: this job builds nothing.
  fmt:
    name: zig fmt --check
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Zig ${{ env.ZIG_VERSION }}
        run: |
          set -euo pipefail
          tgz="zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          curl -fsSL --retry 3 --retry-delay 2 -o "/tmp/${tgz}" \
            "https://ziglang.org/download/${ZIG_VERSION}/${tgz}"
          echo "${ZIG_SHA256}  /tmp/${tgz}" | sha256sum --check -
          mkdir -p "/tmp/zig-${ZIG_VERSION}"
          tar -xf "/tmp/${tgz}" --strip-components=1 -C "/tmp/zig-${ZIG_VERSION}"
          test "$(/tmp/zig-${ZIG_VERSION}/zig version)" = "${ZIG_VERSION}"
          echo "/tmp/zig-${ZIG_VERSION}" >> "$GITHUB_PATH"

      - name: zig fmt --check
        run: zig fmt --check build.zig src tests bench probe fixture

  # ------------------------------------------------------------------ docs --
  # `zig build docs` installs the library's emitted doc comments into
  # zig-out/docs (in build.zig, `docs_step` depends on `install_docs`, the
  # `addInstallDirectory` that installs `lib.getEmittedDocs()` under `.prefix`
  # with `install_subdir = "docs"`). It is the only job that PARSES every
  # doc comment in src/, so a malformed `///` block fails here and nowhere
  # else - a class of break the compiler will not report to a job that only
  # links the library. No cache: the artifact is a few hundred kilobytes of
  # HTML and caching it would cost more than rebuilding it.
  docs:
    name: zig build docs
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Zig ${{ env.ZIG_VERSION }}
        run: |
          set -euo pipefail
          tgz="zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          curl -fsSL --retry 3 --retry-delay 2 -o "/tmp/${tgz}" \
            "https://ziglang.org/download/${ZIG_VERSION}/${tgz}"
          echo "${ZIG_SHA256}  /tmp/${tgz}" | sha256sum --check -
          mkdir -p "/tmp/zig-${ZIG_VERSION}"
          tar -xf "/tmp/${tgz}" --strip-components=1 -C "/tmp/zig-${ZIG_VERSION}"
          test "$(/tmp/zig-${ZIG_VERSION}/zig version)" = "${ZIG_VERSION}"
          echo "/tmp/zig-${ZIG_VERSION}" >> "$GITHUB_PATH"

      - name: zig build docs
        run: zig build docs

# The caches, in one place, because there are exactly two decisions here.
#
# WHAT IS CACHED, AND WHY IT IS SAFE. Two different things, and the difference
# matters. (1) The LOCAL Zig cache, `.zig-cache`, where `addRunArtifact` launches
# the test binaries and the benchmark binaries from. Zig's local cache is
# content-addressed: a restored manifest is used only when every input file's
# hash matches what that manifest recorded, so a restore can save work and
# cannot substitute a stale binary for a changed source. A too-narrow key costs
# runtime, never correctness. (2) The installer work root of the `analyze` and
# `cross` jobs, which is the quality-tool SOURCES keyed by their pins - see THE
# SECOND CACHE below, which is a different decision with a different key.
#
# WHAT THE .zig-cache KEY IS. The toolchain version, the runner platform, one
# dimension naming the job's own compilation, and the hash of build.zig,
# build.zig.zon and src/. The version is in the key because a manifest written
# by 0.16.0 means nothing to any other release.
#
# THE JOB DIMENSION, AND WHY IT MUST NOT BE TIDIED AWAY. The optimise value in
# the `test` job, and a literal `bench` in the job that has no matrix. Not for
# tidiness. GitHub Actions reserves a cache key the first time one job saves it
# and refuses every save that arrives for a key already reserved, so a key
# shared by a matrix is a key that works only while one leg is running. When
# this file's `cross` job was a four-leg matrix, the four test legs, the four
# cross legs and the bench job - nine jobs, in the very runs the cache exists to
# make cheap - all wrote one key, and the cache was warm only on a quiet commit.
# If you are reading this and about to drop the matrix value from the key
# because the legs look alike: four optimise modes are four compilations and
# four different .zig-cache contents, and a manifest written for one mode
# means nothing to the next.
#
# THE SECOND CACHE, AND WHY IT IS A DIFFERENT KEY. `analyze` and `cross` cache
# $QUALITY_TOOLS_WORK_ROOT and nothing else. That root holds the upstream
# sources the installer fetched at their pinned revisions and the patches
# applied to them, so its key is the quality distribution and nothing else:
# tools/quality/manifest.tsv, tools/quality/SHA256SUMS, the harness under
# tools/quality/harness/** and the reviewed patches under tools/quality/patches/**
# - the pins, the checksums, and the local source changes the installer applies.
# Two properties make a restore sound rather than
# merely convenient: the installer re-uses a fetched tree only when all four
# recorded facts match exactly -- pinned revision, ordered patch hashes, the
# src source digest, and a digest of the BUILD INPUTS (build.zig, build.zig.zon,
# @embedFile targets, top-level build files) -- and re-fetches otherwise, so a
# stale entry is discarded instead of trusted; and a key names WHICH entry, so a
# narrower key costs a fetch and never a wrong binary. The two jobs carry
# different key dimensions (`-analyzers-` and `-harness-`) for the reservation
# reason above, because they run on the same push.
#
# WHAT IS DELIBERATELY NOT CACHED, AND WHY. (a) The install prefix. Those
# binaries are the job's output; caching them would make a run assert tools it
# did not install. (b) .zig-cache for `analyze` and `cross`. Neither job builds
# through the workspace cache: the gate is given GATE_CACHE_DIR and
# GATE_GLOBAL_CACHE_DIR outside the checkout, and cross-test creates a fresh
# cache under TMPDIR and removes it on exit, because a cross cache is
# target-specific and a stale one is not a thing this job wants to reason
# about. Caching either would put gigabytes of per-target state behind a key
# that would have to encode the target set to stay correct - and the target set
# is the profile's, not this file's.
#
# ALSO NOT IN THAT KEY: `tests/` and `bench/`. They change
# far more often than `src/`, and a key that moved with them would miss on
# every test edit - which is exactly the edit a developer most wants to be
# fast. Leaving them out means a test-only or benchmark-only change restores
# the library objects and recompiles the roots, which is the work that actually
# changed. That is a wasted rebuild, not a wrong answer.
#
# WHAT IS NOT CACHED AT ALL, AND WHY. The global cache. build.zig.zon:34
# declares no dependencies and fixture/build.zig.zon:6-8 takes this package by
# path, so nothing is ever fetched and the global cache holds nothing this
# build would reuse. The nested consumer build under fixture/ is left alone for
# the same reason its own flags are: `consumerCacheRoot` in build.zig gives it
# two cache directories of its own rather than the machine-wide global cache,
# and where they land is that function's decision, and it has exactly TWO
# candidates: what ZIG_INTERVAL_CONSUMER_CACHE names, if that variable is set
# to something, and otherwise the cache directory THIS build was itself given -
# --cache-dir, or .zig-cache when no flag is passed. Both are resolved to an
# absolute path. The second candidate is the test job's, and there the result
# is CORRECT for three reasons, each a property of this cache rather than of
# luck: the local cache is content-addressed, so a restored manifest is
# used only when every input hashes the same; every key in this file already
# hashes build.zig, so a change to the resolver invalidates that entry
# outright; and the bench and cross jobs never run the consumer step at all, so
# no key here has two writers of it.
#
# It is NOT free, and calling that case harmless was wrong. On a runner the
# second candidate is `.zig-cache` - the cache directory this job's own `zig
# build` was given, with no --cache-dir passed - with `zig-interval-consumer`
# and `zig-interval-consumer-global` appended, so both child caches sit inside
# the `path: .zig-cache` this job's cache action archives: the test entry now
# carries the consumer build's output too. Correct is not the same as free.
# The only size evidence here is dated - that same nested build's local cache
# measured 163 MB when it was captured and 1014 MB at its worst, back when it
# lived at `fixture/.zig-cache` - and no figure in this file is a measurement
# taken on a runner. If that size is ever worth spending, the lever is this
# job's cache path or ZIG_INTERVAL_CONSUMER_CACHE on the runner, never the key:
# a key names WHICH entry, and every entry over this path already names the
# same two directories.
#
# The containment at stake was always the GLOBAL one, and that still holds.
#
# Where a key's precision was in doubt the answer here was to leave the cache
# out, not to widen the key until it looked precise.
